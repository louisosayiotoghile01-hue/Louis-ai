<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Louis AI</title>

<link rel="stylesheet" href="style.css">

</head>

<body>
<div class="header">
    <h1>Louis AI</h1>
    <p>Version 2.0 Beta</p>
    <p>Your Intelligent Personal AI Assistant</p>
</div>
<div class="chat-box">

<div class="welcome">
    <p>👋</p>

    <h2>Welcome to Louis AI</h2>

    <p>
        Your intelligent personal AI assistant.
    </p>

    <p>
        I can chat with you, remember important things,
        help you with questions, and learn from you.
    </p>

    <p>
        <small>Version 2.0 Beta</small>
    </p>
</div>

<div id="chat"></div>

<div class="input-area">

<input
id="userInput"
type="text"
placeholder="Type your message"
onkeypress="if(event.key==='Enter') sendMessage();">

<button onclick="sendMessage()">Send</button>
<button onclick="clearChat()">Clear Chat</button>
<button onclick="toggleDarkMode()">🌙 Dark Mode</button>
<button onclick="startListening()">🎤 Speak</button>

</div>

</div>
<script src="script.js"></script>
</body>
</html>
