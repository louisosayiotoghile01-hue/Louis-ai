name: Create Louis AI Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore louis-ai-release.jks \
            -alias louis-ai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storetype JKS \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=Louis AI, OU=Louis AI, O=Louis AI, L=Benin City, ST=Edo, C=NG"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 louis-ai-release.jks > louis-ai-release.base64

      - name: Upload Base64 keystore
        uses: actions/upload-artifact@v4
        with:
          name: louis-ai-keystore-base64
          path: louis-ai-release.base64
