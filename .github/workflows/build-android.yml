name: Build Louis AI Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp app.html www/app.html
          cp style.css www/
          cp script.js www/
          cp knowledge.json www/
          cp manifest.json www/
          cp service-worker.js www/
          cp -r icons www/

      - name: Create Android project if needed
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Louis AI APK
        uses: actions/upload-artifact@v4
        with:
          name: louis-ai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
